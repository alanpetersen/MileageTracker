name: MileageTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MileageTracker:
    type: application
    platform: iOS
    sources: [MileageTracker]
    info:
      path: MileageTracker/Info.plist
      properties:
        CFBundleDisplayName: Mileage Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Mileage Tracker uses the camera to read your odometer.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MileageTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MileageTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MileageTrackerTests]
    dependencies:
      - target: MileageTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MileageTrackerTests
        GENERATE_INFOPLIST_FILE: YES
