name: MileageTracker
options:
  bundleIdPrefix: com.jthought
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 294H47495Y
    CODE_SIGN_STYLE: Automatic
targets:
  MileageTracker:
    type: application
    platform: iOS
    sources: [MileageTracker]
    info:
      path: MileageTracker/Info.plist
      properties:
        CFBundleDisplayName: Mileage Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Mileage Tracker uses the camera to read your odometer.
        # Lets the app accept iCloud share invitations.
        CKSharingSupported: true
        # Silent pushes tell the app when iCloud data changed on another device.
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: MileageTracker/MileageTracker.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jthought.MileageTracker]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jthought.MileageTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MileageTrackerMac:
    type: application
    platform: macOS
    # Same code as the iPhone/iPad app; only the plist, entitlements and assets differ.
    sources:
      - path: MileageTracker
        excludes: [Info.plist, MileageTracker.entitlements, Assets.xcassets]
      - MileageTrackerMac
    info:
      path: MileageTrackerMac/Info.plist
      properties:
        CFBundleDisplayName: Mileage Tracker
        LSApplicationCategoryType: public.app-category.utilities
        CKSharingSupported: true
    entitlements:
      path: MileageTrackerMac/MileageTrackerMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jthought.MileageTracker]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jthought.MileageTracker
        PRODUCT_NAME: MileageTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MileageTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MileageTrackerTests]
    dependencies:
      - target: MileageTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jthought.MileageTrackerTests
        GENERATE_INFOPLIST_FILE: YES
  MileageTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MileageTrackerUITests]
    dependencies:
      - target: MileageTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jthought.MileageTrackerUITests
        GENERATE_INFOPLIST_FILE: YES
